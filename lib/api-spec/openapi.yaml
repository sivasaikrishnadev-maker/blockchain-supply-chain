openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Blockchain-based supply-chain tracking API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: products
  - name: dashboard
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with a demo role account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated user and bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Invalid email or password
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      security:
        - bearerAuth: []
      summary: Get the authenticated user's profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      security:
        - bearerAuth: []
      summary: Get role-scoped product totals
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"
  /products:
    get:
      operationId: getProducts
      tags: [products]
      security:
        - bearerAuth: []
      summary: List products visible to the current role
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [products]
      security:
        - bearerAuth: []
      summary: Register a product as a manufacturer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Registered product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "409":
          description: Product ID already exists
  /products/{productId}:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    get:
      operationId: getProduct
      tags: [products]
      summary: Get public product tracking details
      responses:
        "200":
          description: Product and supply-chain events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetails"
        "404":
          description: Product not found
  /products/{productId}/events:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    get:
      operationId: getProductEvents
      tags: [products]
      summary: Get public product timeline events
      responses:
        "200":
          description: Product events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupplyEvent"
  /products/{productId}/verify:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    get:
      operationId: verifyProduct
      tags: [products]
      summary: Compare current product data against its original blockchain hash
      responses:
        "200":
          description: Integrity verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Verification"
        "404":
          description: Product not found
  /products/{productId}/receive:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    post:
      operationId: distributorReceive
      tags: [products]
      security:
        - bearerAuth: []
      summary: Receive a created product as a distributor
      responses:
        "200":
          description: Product received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetails"
  /products/{productId}/transfer:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    post:
      operationId: distributorTransfer
      tags: [products]
      security:
        - bearerAuth: []
      summary: Transfer a received product to a retailer
      responses:
        "200":
          description: Product transferred
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetails"
  /products/{productId}/retailer-receive:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    post:
      operationId: retailerReceive
      tags: [products]
      security:
        - bearerAuth: []
      summary: Receive an in-transit product as a retailer
      responses:
        "200":
          description: Product received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetails"
  /products/{productId}/available:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    post:
      operationId: markProductAvailable
      tags: [products]
      security:
        - bearerAuth: []
      summary: Mark a received product available for sale
      responses:
        "200":
          description: Product made available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetails"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    User:
      type: object
      required: [id, name, email, role]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        role:
          type: string
          enum: [manufacturer, distributor, retailer]
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1 }
    AuthSession:
      type: object
      required: [token, user]
      properties:
        token: { type: string }
        user: { $ref: "#/components/schemas/User" }
    DashboardStats:
      type: object
      required: [totalProducts, created, inSupplyChain, available]
      properties:
        totalProducts: { type: integer }
        created: { type: integer }
        inSupplyChain: { type: integer }
        available: { type: integer }
    Product:
      type: object
      required:
        - productId
        - productName
        - batchNumber
        - category
        - manufacturingDate
        - quantity
        - description
        - manufacturer
        - currentStatus
        - productHash
        - blockchainHash
        - blockchainTransaction
        - createdAt
      properties:
        productId: { type: string }
        productName: { type: string }
        batchNumber: { type: string }
        category: { type: string }
        manufacturingDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        quantity: { type: integer }
        description: { type: string }
        manufacturer: { type: string }
        currentStatus:
          type: string
          enum:
            - Created
            - Received by Distributor
            - In Transit to Retailer
            - Received by Retailer
            - Available for Sale
        productHash: { type: string }
        blockchainHash: { type: string }
        blockchainTransaction: { type: string }
        createdAt: { type: string }
    ProductInput:
      type: object
      required: [productId, productName, batchNumber, category, manufacturingDate, quantity, description]
      properties:
        productId: { type: string, minLength: 1 }
        productName: { type: string, minLength: 1 }
        batchNumber: { type: string, minLength: 1 }
        category: { type: string, minLength: 1 }
        manufacturingDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        quantity: { type: integer, minimum: 1 }
        description: { type: string }
    SupplyEvent:
      type: object
      required: [id, productId, eventType, status, actor, actorRole, timestamp, blockchainTransaction]
      properties:
        id: { type: string }
        productId: { type: string }
        eventType: { type: string }
        status: { type: string }
        actor: { type: string }
        actorRole: { type: string, enum: [manufacturer, distributor, retailer] }
        timestamp: { type: string }
        blockchainTransaction: { type: string }
    ProductDetails:
      type: object
      required: [product, events]
      properties:
        product: { $ref: "#/components/schemas/Product" }
        events:
          type: array
          items: { $ref: "#/components/schemas/SupplyEvent" }
    Verification:
      type: object
      required: [verified, message, productHash, blockchainHash, product]
      properties:
        verified: { type: boolean }
        message: { type: string }
        productHash: { type: string }
        blockchainHash: { type: string }
        product: { $ref: "#/components/schemas/Product" }

